    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- jsPsych библиотека -->
    <script src="https://unpkg.com/jspsych@7.3.4"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>

            margin: 50px 0;
        }
    </style>
</head>
<body></body>
<script>

// ==================================================================
// ДАННЫЕ ЗАДАЧ (из твоих CSV файлов)
// ==================================================================

const TASKS_DATA = {
    "easy_ru": [
        {"Word1": "миллионер", "Word2": "купюра", "Word3": "сша", "corrAns": "доллар", "Language": "ru", "Difficulty": "easy"},

        {"Word1": "советник", "Word2": "выборы", "Word3": "республика", "corrAns": "президент", "Language": "ru", "Difficulty": "medium"},

    ],
    "easy_en": [
        {"Word1": "dew", "Word2": "comb", "Word3": "bee", "corrAns": "honey", "Language": "en", "Difficulty": "easy"},
        {"Word1": "worm", "Word2": "shelf", "Word3": "end", "corrAns": "book", "Language": "en", "Difficulty": "easy"},
        {"Word1": "cadet", "Word2": "capsule", "Word3": "ship", "corrAns": "space", "Language": "en", "Difficulty": "easy"},
        {"Word1": "basket", "Word2": "eight", "Word3": "snow", "corrAns": "ball", "Language": "en", "Difficulty": "easy"}
    ],
    "medium_en": [
        {"Word1": "opera", "Word2": "hand", "Word3": "dish", "corrAns": "soap", "Language": "en", "Difficulty": "medium"},
        {"Word1": "cat", "Word2": "number", "Word3": "phone", "corrAns": "call", "Language": "en", "Difficulty": "medium"},
        {"Word1": "man", "Word2": "glue", "Word3": "star", "corrAns": "super", "Language": "en", "Difficulty": "medium"},
        {"Word1": "cover", "Word2": "arm", "Word3": "wear", "corrAns": "under", "Language": "en", "Difficulty": "medium"}
    ],
    "hard_en": [
        {"Word1": "spoon", "Word2": "cloth", "Word3": "card", "corrAns": "table", "Language": "en", "Difficulty": "hard"},
        {"Word1": "pea", "Word2": "shell", "Word3": "chest", "corrAns": "nut", "Language": "en", "Difficulty": "hard"},
        {"Word1": "wise", "Word2": "work", "Word3": "tower", "corrAns": "clock", "Language": "en", "Difficulty": "hard"},
        {"Word1": "reading", "Word2": "service", "Word3": "stick", "corrAns": "lip", "Language": "en", "Difficulty": "hard"}
    ],
    "practice": [
        {"Word1": "тропа", "Word2": "хвоя", "Word3": "зверь", "corrAns": "лес", "Language": "ru", "Difficulty": "easy"},
        {"Word1": "лазурь", "Word2": "мир", "Word3": "облако", "corrAns": "небо", "Language": "ru", "Difficulty": "medium"},
        {"Word1": "страна", "Word2": "общество", "Word3": "ответственность", "corrAns": "гражданин", "Language": "ru", "Difficulty": "hard"},
        {"Word1": "cream", "Word2": "skate", "Word3": "water", "corrAns": "ice", "Language": "en", "Difficulty": "easy"},
        {"Word1": "dream", "Word2": "break", "Word3": "light", "corrAns": "day", "Language": "en", "Difficulty": "medium"},
        {"Word1": "tooth", "Word2": "potato", "Word3": "heart", "corrAns": "sweet", "Language": "en", "Difficulty": "hard"}
    ]
};

// ==================================================================
// ФУНКЦИИ ДЛЯ COUNTERBALANCING
// ==================================================================

function getBlocksOrder(group) {
    const orders = {
        1: ['ru_easy', 'ru_medium', 'ru_hard', 'en_easy', 'en_medium', 'en_hard'],
        2: ['en_easy', 'en_medium', 'en_hard', 'ru_easy', 'ru_medium', 'ru_hard'],
        3: ['ru_easy', 'en_easy', 'ru_medium', 'en_medium', 'ru_hard', 'en_hard'],
        4: ['en_easy', 'ru_easy', 'en_medium', 'ru_medium', 'en_hard', 'ru_hard']
    };
    return orders[group];
}

function getPracticeOrder(group) {
    const orders = {
        1: [
            {lang: 'ru', diff: 'easy'}, {lang: 'ru', diff: 'medium'}, {lang: 'ru', diff: 'hard'},
            {lang: 'en', diff: 'easy'}, {lang: 'en', diff: 'medium'}, {lang: 'en', diff: 'hard'}
        ],
        2: [
            {lang: 'en', diff: 'easy'}, {lang: 'en', diff: 'medium'}, {lang: 'en', diff: 'hard'},
            {lang: 'ru', diff: 'easy'}, {lang: 'ru', diff: 'medium'}, {lang: 'ru', diff: 'hard'}
        ],
        3: [
            {lang: 'ru', diff: 'easy'}, {lang: 'en', diff: 'easy'},
            {lang: 'ru', diff: 'medium'}, {lang: 'en', diff: 'medium'},
            {lang: 'ru', diff: 'hard'}, {lang: 'en', diff: 'hard'}
        ],
        4: [
            {lang: 'en', diff: 'easy'}, {lang: 'ru', diff: 'easy'},
            {lang: 'en', diff: 'medium'}, {lang: 'ru', diff: 'medium'},
            {lang: 'en', diff: 'hard'}, {lang: 'ru', diff: 'hard'}
        ]
    };
    return orders[group];
}

// ==================================================================
// ФУНКЦИЯ СОЗДАНИЯ ОДНОЙ ЗАДАЧИ CRA
// ==================================================================

function createCRATrial(taskData, blockKey, trialIndex, showFeedback = true) {
    const trials = [];
    
    // 1. Показ задачи + ввод ответа
    const taskTrial = {
        type: jsPsychSurvey,
        pages: [[
            {
                type: 'html',
                prompt: `<div class="cra-words">${taskData.Word1}&nbsp;&nbsp;&nbsp;&nbsp;${taskData.Word2}&nbsp;&nbsp;&nbsp;&nbsp;${taskData.Word3}</div>
                         <div class="cra-prompt">Введите ответ (начальная форма, единственное число):</div>`
            },
            {
                type: 'text',
                prompt: '',
                name: 'response',
                required: true,
                textbox_columns: 30
            }
        ]],
        button_label_finish: 'Продолжить',
        data: {
            task_type: 'cra_response',
            block: blockKey,
            trial_index: trialIndex,
            word1: taskData.Word1,
            word2: taskData.Word2,
            word3: taskData.Word3,
            correct_answer: taskData.corrAns,
            language: taskData.Language,
            difficulty: taskData.Difficulty
        },
        on_finish: function(data) {
            const response = data.response.response.trim().toLowerCase();
            const correct = response === taskData.corrAns.toLowerCase();
            data.user_response = response;
            data.correct = correct;
        }
    };
    trials.push(taskTrial);
    
    // 2-5. Опросники ДО обратной связи
    const scaleOptions = ['1', '2', '3', '4', '5', '6', '7'];
    
    // Confidence
    trials.push({
        type: jsPsychSurvey,
        pages: [[
            {
                type: 'likert',
                prompt: 'Насколько Вы уверены в своём ответе?',
                name: 'confidence',
                options: scaleOptions,
                required: true,
                labels: ['совсем не уверен', '', '', '', '', '', 'абсолютно уверен']
            }
        ]],
        data: {
            task_type: 'rating_confidence',
            block: blockKey,
            trial_index: trialIndex
        },
        on_finish: function(data) {
            data.confidence = parseInt(data.response.confidence);
        }
    });
    
    // Insight
    trials.push({
        type: jsPsychSurvey,
        pages: [[
            {
                type: 'likert',
                prompt: 'Насколько решение пришло как инсайт, озарение?<br>(1 - перебирал варианты, 7 - пришло само)',
                name: 'insight',
                options: scaleOptions,
                required: true,
                labels: ['перебирал варианты', '', '', '', '', '', 'пришло само']
            }
        ]],
        data: {
            task_type: 'rating_insight',
            block: blockKey,
            trial_index: trialIndex
        },
        on_finish: function(data) {
            data.insight = parseInt(data.response.insight);
        }
    });
    
    // Suddenness
    trials.push({
        type: jsPsychSurvey,
        pages: [[
            {
                type: 'likert',
                prompt: 'Насколько внезапно пришло решение?',
                name: 'suddenness',
                options: scaleOptions,
                required: true,
                labels: ['совсем не внезапно', '', '', '', '', '', 'очень внезапно']
            }
        ]],
        data: {
            task_type: 'rating_suddenness',
            block: blockKey,
            trial_index: trialIndex
        },
        on_finish: function(data) {
            data.suddenness = parseInt(data.response.suddenness);
        }
    });
    
    // Pleasure
    trials.push({
        type: jsPsychSurvey,
        pages: [[
            {
                type: 'likert',
                prompt: 'Насколько приятно было решать задачу?',
                name: 'pleasure',
                options: scaleOptions,
                required: true,
                labels: ['совсем неприятно', '', '', '', '', '', 'очень приятно']
            }
        ]],
        data: {
            task_type: 'rating_pleasure',
            block: blockKey,
            trial_index: trialIndex
        },
        on_finish: function(data) {
            data.pleasure = parseInt(data.response.pleasure);
        }
    });
    
    // 6. Обратная связь (если нужна)
    if (showFeedback) {
        trials.push({
            type: jsPsychHtmlKeyboardResponse,
            stimulus: function() {
                const lastResponse = jsPsych.data.get().filter({trial_index: jsPsych.getProgress().current_trial_global - 5}).values()[0];
                const correct = lastResponse.correct;
                const userAns = lastResponse.user_response;
                const correctAns = taskData.corrAns;
                
                if (correct) {
                    return `<div class="feedback correct">✓ Верно!</div>
                            <div style="font-size: 24px;">Правильный ответ: ${correctAns}</div>`;
                } else {
                    return `<div class="feedback incorrect">✗ Неверно</div>
                            <div style="font-size: 24px;">Ваш ответ: ${userAns}</div>
                            <div style="font-size: 24px;">Правильный ответ: ${correctAns}</div>`;
                }
            },
            choices: "NO_KEYS",
            trial_duration: 1500,
            data: {
                task_type: 'feedback',
                block: blockKey,
                trial_index: trialIndex
            }
        });
    }
    
    // 7-9. Опросники ПОСЛЕ обратной связи
    
    // Surprise
    trials.push({
        type: jsPsychSurvey,
        pages: [[
            {
                type: 'likert',
                prompt: 'Насколько удивил правильный ответ?',
                name: 'surprise',
                options: scaleOptions,
                required: true,
                labels: ['совсем не удивил', '', '', '', '', '', 'сильно удивил']
            }
        ]],
        data: {
            task_type: 'rating_surprise',
            block: blockKey,
            trial_index: trialIndex
        },
        on_finish: function(data) {
            data.surprise = parseInt(data.response.surprise);
        }
    });
    
    // Relief
    trials.push({
        type: jsPsychSurvey,
        pages: [[
            {
                type: 'likert',
                prompt: 'Насколько сильное облегчение после решения?',
                name: 'relief',
                options: scaleOptions,
                required: true,
                labels: ['нет облегчения', '', '', '', '', '', 'сильное облегчение']
            }
        ]],
        data: {
            task_type: 'rating_relief',
            block: blockKey,
            trial_index: trialIndex
        },
        on_finish: function(data) {
            data.relief = parseInt(data.response.relief);
        }
    });
    
    // Motivation
    trials.push({
        type: jsPsychSurvey,
        pages: [[
            {
                type: 'likert',
                prompt: 'Насколько мотивированы решать следующую задачу?',
                name: 'motivation',
                options: scaleOptions,
                required: true,
                labels: ['совсем не мотивирован', '', '', '', '', '', 'сильно мотивирован']
            }
        ]],
        data: {
            task_type: 'rating_motivation',
            block: blockKey,
            trial_index: trialIndex
        },
        on_finish: function(data) {
            data.motivation = parseInt(data.response.motivation);
        }
    });
    
    return trials;
}

// ==================================================================
// ОСНОВНОЙ КОД ЭКСПЕРИМЕНТА
// ==================================================================

// Инициализация jsPsych
const jsPsych = initJsPsych({
    on_finish: function() {
        // Сохранение данных
        const data = jsPsych.data.get();
        const csv = data.csv();
        
        // Скачивание CSV
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        const url = URL.createObjectURL(blob);
        link.setAttribute('href', url);
        link.setAttribute('download', `cra_results_${Date.now()}.csv`);
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        
        // Показ завершения
        jsPsych.getDisplayElement().innerHTML = `
            <div style="text-align: center; font-size: 28px; margin-top: 100px;">
                <h1>Спасибо за участие!</h1>
                <p>Данные сохранены автоматически.</p>
                <p>Вы можете закрыть эту страницу.</p>
            </div>
        `;
    }
});

// Сбор информации об участнике
const participantInfo = {
    type: jsPsychSurvey,
    pages: [
        [
            {
                type: 'text',
                prompt: 'Возраст:',
                name: 'age',
                required: true
            },
            {
                type: 'multi-choice',
                prompt: 'Пол:',
                name: 'gender',
                options: ['М', 'Ж'],
                required: true
            },
            {
                type: 'multi-choice',
                prompt: 'Уровень английского (B2-C2):',
                name: 'english_level',
                options: ['B2', 'C1', 'C2'],
                required: true
            }
        ],
        [
            {
                type: 'multi-choice',
                prompt: 'Студент РАНХиГС?',
                name: 'is_student',
                options: ['Да', 'Нет'],
                required: true
            }
        ]
    ],
    button_label_next: 'Далее',
    button_label_finish: 'Начать эксперимент',
    data: {
        task_type: 'participant_info'
    },
    on_finish: function(data) {
        // Случайное определение группы
        const group = Math.floor(Math.random() * 4) + 1;
        data.group = group;
        jsPsych.data.addProperties({ group: group });
        
        // Сохраняем всю информацию
        jsPsych.data.addProperties({
            participant_age: data.response.age,
            participant_gender: data.response.gender,
            participant_english: data.response.english_level,
            participant_student: data.response.is_student,
            timestamp: new Date().toISOString()
        });
        
        console.log('Группа участника:', group);
    }
};

// Инструкции
const instructions = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `
        <div class="instructions">
            <h1 style="text-align: center;">Добро пожаловать в эксперимент!</h1>
            
            <p>Вам будут показаны три слова, которые связаны между собой общим словом-ответом.</p>
            
            <p><strong>Ваша задача:</strong> найти четвертое слово, которое образует устойчивое словосочетание 
            или составное слово с каждым из трех слов.</p>
            
            <p><strong>Пример (русский):</strong><br>
            тропа / хвоя / зверь → <strong>лес</strong><br>
            (лесная тропа, хвойный лес, лесной зверь)</p>
            
            <p><strong>Пример (английский):</strong><br>
            cream / skate / water → <strong>ice</strong><br>
            (ice cream, ice skate, ice water)</p>
            
            <p><strong>Важно:</strong></p>
            <ul>
                <li>Вводите ответ в <strong>начальной форме, единственном числе</strong></li>
                <li>После ввода нажмите Enter или кнопку "Продолжить"</li>
                <li>После каждого ответа будет несколько вопросов по шкале 1-7</li>
            </ul>
            
            <p>Сначала будут тренировочные задания, затем основная часть.</p>
            
            <p style="text-align: center; font-size: 24px; margin-top: 40px;">
                <strong>Нажмите ПРОБЕЛ для продолжения</strong>
            </p>
        </div>
    `,
    choices: [' ']
};

// Создание timeline
let timeline = [];

timeline.push(participantInfo);
timeline.push(instructions);

// Тренировочные задания
timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: '<div class="block-message">Тренировочные задания</div><p style="text-align:center; font-size:20px;">Нажмите ПРОБЕЛ</p>',
    choices: [' ']
});

// Получаем группу и создаем порядок практики
const getPracticeTrials = function() {
    const group = jsPsych.data.get().filter({task_type: 'participant_info'}).values()[0].group;
    const practiceOrder = getPracticeOrder(group);
    const practiceTrials = [];
    
    practiceOrder.forEach((spec, idx) => {
        const task = TASKS_DATA.practice.find(t => 
            t.Language === spec.lang && t.Difficulty === spec.diff
        );
        if (task) {
            const trials = createCRATrial(task, 'practice', idx, true);
            practiceTrials.push(...trials);
        }
    });
    
    return practiceTrials;
};

timeline.push({
    timeline: getPracticeTrials,
    conditional_function: function() {
        return true;
    }
});

// Переход к основной части
timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: '<div class="instructions"><h2 style="text-align:center;">Тренировка окончена</h2><p style="text-align:center; font-size:20px;">Сейчас начинается основная часть.<br><br>Нажмите ПРОБЕЛ</p></div>',
    choices: [' ']
});

// Основные блоки
const getMainBlocks = function() {
    const group = jsPsych.data.get().filter({task_type: 'participant_info'}).values()[0].group;
    const blocksOrder = getBlocksOrder(group);
    const allBlockTrials = [];
    
    blocksOrder.forEach((blockKey, blockIdx) => {
        // Сообщение о блоке
        const lang = blockKey.includes('ru') ? 'Русский' : 'Английский';
        let percent = '';
        if (blockKey.includes('easy')) percent = '100%-70%';
        else if (blockKey.includes('medium')) percent = '69%-30%';
        else percent = '29%-0%';
        
        allBlockTrials.push({
            type: jsPsychHtmlKeyboardResponse,
            stimulus: `<div class="block-message">Блок ${blockIdx + 1}: ${lang} (${percent})</div>`,
            choices: "NO_KEYS",
            trial_duration: 2000
        });
        
        // Задачи блока
        const blockTasks = TASKS_DATA[blockKey];
        blockTasks.forEach((task, taskIdx) => {
            const trials = createCRATrial(task, blockKey, taskIdx, true);
            allBlockTrials.push(...trials);
        });
    });
    
    return allBlockTrials;
};

timeline.push({
    timeline: getMainBlocks,
    conditional_function: function() {
        return true;
    }
});

// Завершение
timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `
        <div style="text-align: center; font-size: 28px; margin-top: 100px;">
